<body>
  <!--
    Formulaire caché pour la détection Netlify Forms au build.
    React soumet via fetch() — ce bloc est requis pour que Netlify
    enregistre le formulaire dans son tableau de bord.
  -->
  <form name="waitlist" netlify netlify-honeypot="bot-field" style="display:none">
    <input name="bot-field" />
    <input name="email" type="email" />
    <input name="role" />
    <input name="search" />
  </form>
